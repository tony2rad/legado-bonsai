<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1B241F">
<title>Producción de macetas — Plantillas de Macetas Bonsái</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#EEF0EA; --panel:#FFFFFF; --ink:#1E2622; --muted:#5F6963; --line:#CBD0C8;
    --accent:#8C3B23; --accent-ink:#FFFFFF; --glaze:#35606E; --glaze-soft:#DDE8EB;
    --paper:#FFFFFF; --paper-shadow:rgba(20,30,25,.22); --warn:#9A5B00; --warn-bg:#FBF1DC;
    --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#151917; --panel:#1E2421; --ink:#E5E8E2; --muted:#9AA49D; --line:#333B36;
      --accent:#D8764F; --accent-ink:#1A0E08; --glaze:#8BB9C7; --glaze-soft:#22333A;
      --paper-shadow:rgba(0,0,0,.55); --warn:#E0A94A; --warn-bg:#2E2513;
    }
  }
  :root[data-theme="dark"]{
    --bg:#151917; --panel:#1E2421; --ink:#E5E8E2; --muted:#9AA49D; --line:#333B36;
    --accent:#D8764F; --accent-ink:#1A0E08; --glaze:#8BB9C7; --glaze-soft:#22333A;
    --paper-shadow:rgba(0,0,0,.55); --warn:#E0A94A; --warn-bg:#2E2513;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);padding-inline:16px;padding-block:0 32px}
  .topbar{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:18px 10px;border-bottom:1px solid var(--line);margin-bottom:18px}
  .topbar h1{font:700 26px/1.1 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
  .topbar .sub{color:var(--muted);font-size:13px;margin-top:4px;max-width:70ch}
  .btn{font:600 14px var(--sans);border:0;border-radius:6px;padding:10px 16px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
  .btn:focus-visible,input:focus-visible,select:focus-visible,.seg label:focus-within{outline:2px solid var(--glaze);outline-offset:2px}
  .app{display:grid;grid-template-columns:320px minmax(0,1fr);gap:22px;align-items:start}
  @media (max-width:820px){.app{grid-template-columns:1fr}.panel{position:static}}
  .panel{position:sticky;top:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:14px}
  .panel h2{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
  .seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .seg label{display:block;text-align:center;font:600 13px var(--sans);padding:8px 6px;cursor:pointer;color:var(--muted)}
  .seg input{position:absolute;opacity:0;width:0;height:0}
  .seg input:checked+span{display:block;margin:-8px -6px;padding:8px 6px;background:var(--glaze);color:#fff}
  .style-note{font-size:12.5px;line-height:1.45;color:var(--muted);background:var(--glaze-soft);border-radius:6px;padding:8px 10px;margin-top:8px}
  .style-note b{color:var(--ink);font-weight:600}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  label.f{display:grid;gap:4px;font-size:12px;color:var(--muted)}
  label.f span b{color:var(--ink);font-weight:500}
  input,select{font:14px var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:7px 8px;width:100%}
  input:disabled,select:disabled{opacity:.4}
  .summary{font:12.5px/1.55 var(--mono);color:var(--muted);border-top:1px solid var(--line);padding-top:12px;display:grid;gap:3px}
  .summary b{color:var(--ink);font-weight:500}
  .warn{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:8px 10px;font-size:12.5px;line-height:1.4}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .tab{font:500 13px var(--sans);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:7px 11px;cursor:pointer;text-align:left;max-width:100%}
  .tab small{display:block;font:11px/1.3 var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
  .tab[aria-selected="true"]{background:var(--glaze);border-color:var(--glaze);color:#fff}
  .tab[aria-selected="true"] small{color:rgba(255,255,255,.8)}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .sheet.off{display:none}
  .stage{position:relative;overflow:hidden}
  .sheets{transform-origin:top left;display:grid;gap:22px;width:297mm}
  .sheet{position:relative;width:297mm;height:210mm;background:var(--paper);color:#000;box-shadow:0 2px 14px var(--paper-shadow);overflow:hidden;font-family:var(--sans)}
  .sheet .foot{position:absolute;left:10mm;right:10mm;bottom:5.5mm;font:2.6mm/1 var(--mono);color:#333;display:flex;justify-content:space-between;border-top:.2mm solid #999;padding-top:1.4mm}
  .piece{position:absolute}
  .piece .cap{height:6mm;font:2.9mm/5.4mm var(--mono);color:#000;white-space:nowrap;overflow:hidden}
  .piece svg{display:block}
  .cover{position:absolute;inset:10mm 10mm 18mm;display:grid;grid-template-columns:118mm minmax(0,1fr);gap:8mm}
  .cover .eyebrow{font:500 2.8mm var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#444}
  .cover h1{font:700 7.4mm/1.05 var(--display);margin:1.5mm 0 1mm;letter-spacing:-.01em}
  .cover .style{font:2.9mm/1.4 var(--sans);color:#333;margin-bottom:2.5mm}
  .cover table{border-collapse:collapse;width:100%;font:2.85mm/1.42 var(--mono);font-variant-numeric:tabular-nums}
  .cover th{text-align:left;font-weight:500;color:#444;border-bottom:.3mm solid #000;padding:.6mm 0}
  .cover td{padding:.45mm 0;border-bottom:.15mm solid #bbb}
  .cover td:nth-child(2),.cover td:nth-child(3),.cover th:nth-child(2),.cover th:nth-child(3){text-align:right}
  .cover .note{font:2.8mm/1.42 var(--sans);margin-top:2.5mm}
  .cover ol{margin:1.2mm 0 0;padding-left:5mm;font:2.8mm/1.4 var(--sans)}
  .cover .legend{display:grid;grid-template-columns:auto 1fr;gap:1.1mm 3mm;align-items:center;font:2.7mm/1.3 var(--sans);margin-top:2.5mm}
  .cover .right{display:grid;grid-template-rows:auto 1fr;gap:4mm;min-width:0}
  .cover .duo{display:grid;grid-template-columns:1fr 1fr;gap:6mm;align-items:start}
  .cover .viewcap{font:2.6mm/1.4 var(--mono);color:#333;margin-top:1.5mm}
  @page{size:A4 landscape;margin:0}
  @media print{
    body{background:#fff;padding:0}
    .topbar,.panel,.tabs{display:none}
    .sheet.off{display:block}
    .app{display:block}
    .stage{overflow:visible;height:auto!important}
    .sheets{transform:none!important;gap:0}
    .sheet{box-shadow:none;break-after:page;page-break-after:always}
    .sheet:last-child{break-after:auto;page-break-after:auto}
  }
</style>
</head>
<body>
<style id="pageRule">@page{size:A4 landscape;margin:0}</style>

<div class="topbar">
  <div>
    <h1>Plantillas de Macetas Bonsái</h1>
    <div class="sub">Patrones de corte en arcilla y moldes de cemento, a escala real, listos para imprimir. Todas las medidas en centímetros.</div>
  </div>
  <button class="btn" id="btnPrint" type="button">Imprimir al 100 %</button>
</div>

<div class="app">
  <aside class="panel">
    <div>
      <h2>Material</h2>
      <div class="seg" role="radiogroup">
        <label><input type="radio" name="mat" id="matClay" value="clay" checked><span>Arcilla · placas</span></label>
        <label><input type="radio" name="mat" id="matCement" value="cement"><span>Cemento · moldes</span></label>
      </div>
    </div>
    <div>
      <h2>Modelo según estilo de bonsái</h2>
      <select id="preset" aria-label="Modelo de maceta"></select>
      <div class="style-note" id="styleNote"></div>
    </div>
    <label class="f"><span>Forma</span>
      <select id="type"><option value="rect">Rectangular / cuadrada</option><option value="oval">Ovalada</option><option value="round">Redonda</option></select>
    </label>
    <div class="grid2">
      <label class="f"><span>Largo <b>cm</b> (terminada)</span><input id="L" type="number" step="0.5" min="4" max="60" value="20"></label>
      <label class="f"><span>Ancho <b>cm</b></span><input id="W" type="number" step="0.5" min="4" max="60" value="15"></label>
      <label class="f"><span>Alto total <b>cm</b></span><input id="H" type="number" step="0.5" min="2" max="30" value="5.5"></label>
      <label class="f"><span id="tLabel">Grosor placa <b>cm</b></span><input id="t" type="number" step="0.1" min="0.4" max="4" value="0.7"></label>
      <label class="f" id="shrinkF"><span>Contracción <b>%</b></span><input id="shrink" type="number" step="0.5" min="0" max="20" value="12"></label>
      <label class="f" id="baseF" hidden><span>Fondo cemento <b>cm</b></span><input id="base" type="number" step="0.1" min="0.5" max="5" value="2"></label>
      <label class="f"><span id="flareLabel">Inclinación <b>cm</b>/lado</span><input id="flare" type="number" step="0.1" min="0" max="2" value="0.4"></label>
      <label class="f"><span>Altura patas <b>cm</b></span><input id="feet" type="number" step="0.1" min="0" max="4" value="1.2"></label>
      <label class="f" id="boardF" hidden><span>Tablero MDF <b>cm</b></span><input id="board" type="number" step="0.1" min="0.3" max="2" value="0.9"></label>
      <label class="f"><span>Papel</span><select id="paper"><option value="A4">A4 apaisado</option><option value="A3">A3 apaisado</option></select></label>
    </div>
    <div>
      <h2>Perfil de la pared</h2>
      <div class="grid2">
        <label class="f"><span>Borde</span>
          <select id="rim"><option value="sotoen">Sotoen · labio externo</option><option value="kittate">Kittate · sin labio</option><option value="uchien">Uchien · labio interno</option></select></label>
        <label class="f"><span>Labio <b>cm</b></span><input id="lip" type="number" step="0.1" min="0.2" max="2" value="0.6"></label>
        <label class="f"><span>Cuerpo</span>
          <select id="body"><option value="liso">Liso</option><option value="cinturon">Con cinturón</option><option value="panza">Panza convexa</option></select></label>
        <label class="f"><span>Esquinas</span>
          <select id="corner"><option value="recta">Rectas</option><option value="sumikiri">Sumikiri · corte</option><option value="nadekaku">Nadekaku · redondeada</option><option value="sumiiri">Sumiiri · entrante</option></select></label>
      </div>
      <label class="f" style="margin-top:10px"><span>Acabado (ilustración)</span>
        <select id="finish">
          <optgroup label="Arcilla"><option value="shudei">Shudei · rojizo sin esmalte</option><option value="azul">Esmalte azul namako</option><option value="oribe">Esmalte verde oribe</option><option value="crema">Esmalte crema</option></optgroup>
          <optgroup label="Cemento"><option value="gris">Gris natural</option><option value="oxido">Óxido de hierro</option><option value="negro">Óxido negro</option></optgroup>
        </select>
      </label>
    </div>
    <div class="summary" id="summary"></div>
    <div id="warns" style="display:grid;gap:6px"></div>
  </aside>

  <div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Hojas"></div>
    <div class="stage" id="stage"><div class="sheets" id="sheets"></div></div>
  </div>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const PAPER={A4:{w:297,h:210},A3:{w:420,h:297}};
  const MARGIN=10, GAP=7, CAP=6, OV=10, FOOT=8;
  const PRESETS=[
    {id:'mame',    name:'Mame ovalada',            style:'Mame (miniatura)',            note:'Árboles de menos de 10 cm. Placa muy fina, sin inclinación, patas mínimas.',                          type:'oval', L:8,  W:6,  H:2.5, t:0.5, flare:0,   feet:0.6, paper:'A4', rim:'kittate', body:'liso',     corner:'recta'},
    {id:'shohin',  name:'Shohin rectangular',      style:'Shohin (pequeño)',            note:'Chokkan y moyogi pequeños. Proporción clásica 4:3 con ligera inclinación de pared.',                  type:'rect', L:12, W:9,  H:4,   t:0.6, flare:0.3, feet:1,   paper:'A4', rim:'sotoen',  body:'liso',     corner:'recta'},
    {id:'chokkan', name:'Rectangular clásica',     style:'Chokkan (vertical formal)',   note:'Líneas rectas y esquinas marcadas refuerzan la formalidad del tronco recto. Largo ≈ 2/3 del alto del árbol.', type:'rect', L:20, W:15, H:5.5, t:0.7, flare:0.4, feet:1.2, paper:'A4', rim:'sotoen',  body:'liso',     corner:'sumikiri'},
    {id:'moyogi',  name:'Ovalada clásica',         style:'Moyogi (vertical informal)',  note:'Curvas suaves para troncos sinuosos. La maceta más versátil del catálogo.',                             type:'oval', L:22, W:16, H:5,   t:0.7, flare:0,   feet:1.2, paper:'A4', rim:'sotoen',  body:'liso',     corner:'recta'},
    {id:'shakan',  name:'Rectangular alargada',    style:'Shakan (inclinado)',          note:'Muy larga y baja: el tronco se planta descentrado y la masa de la copa queda sobre la maceta.',         type:'rect', L:26, W:16, H:4.5, t:0.7, flare:0.5, feet:1.2, paper:'A3', rim:'kittate', body:'liso',     corner:'nadekaku'},
    {id:'kengai',  name:'Cuadrada profunda',       style:'Kengai (cascada)',            note:'Alta y estrecha, da contrapeso visual a la rama que cae por debajo de la base. Paredes reforzadas.',    type:'rect', L:13, W:13, H:16,  t:0.8, flare:0.3, feet:1.5, paper:'A4', rim:'sotoen',  body:'cinturon', corner:'recta'},
    {id:'hankengai',name:'Cuadrada media',         style:'Han-kengai (semicascada)',    note:'Profundidad intermedia: la rama no baja del borde de la maceta pero sí de su línea media.',            type:'rect', L:15, W:15, H:9,   t:0.8, flare:0.3, feet:1.2, paper:'A4', rim:'sotoen',  body:'liso',     corner:'sumikiri'},
    {id:'bunjin',  name:'Redonda tambor',          style:'Bunjin (literati)',           note:'Pequeña y redonda para troncos altos y desnudos. Menos maceta, más árbol.',                            type:'round',L:12, W:12, H:6,   t:0.7, flare:0,   feet:1,   paper:'A4', rim:'kittate', body:'cinturon', corner:'recta'},
    {id:'fukinagashi',name:'Ovalada estrecha',     style:'Fukinagashi (barrido por el viento)', note:'Larga y muy baja: el árbol se planta en el extremo opuesto a la dirección del viento.',        type:'oval', L:24, W:13, H:3.5, t:0.7, flare:0,   feet:1,   paper:'A3', rim:'kittate', body:'liso',     corner:'recta'},
    {id:'yose',    name:'Bandeja ovalada',         style:'Yose-ue (bosque)',            note:'Muy ancha y plana para varios troncos. Placa gruesa y patas bajas para evitar alabeo.',                type:'oval', L:32, W:22, H:3.5, t:0.8, flare:0,   feet:1,   paper:'A3', rim:'kittate', body:'liso',     corner:'recta'},
    {id:'ishitsuki',name:'Bandeja rectangular',    style:'Ishitsuki (sobre roca) · Saikei', note:'Bandeja de agua o paisaje. Casi sin profundidad, drenaje generoso.',                               type:'rect', L:36, W:24, H:3,   t:0.8, flare:0,   feet:0.8, paper:'A3', rim:'kittate', body:'liso',     corner:'recta'},
    {id:'sokan',   name:'Rectangular profunda',    style:'Sokan (tronco doble) · nebari fuerte', note:'Más profundidad para raíces vigorosas y troncos gruesos.',                                       type:'rect', L:18, W:13, H:8,   t:0.8, flare:0.4, feet:1.3, paper:'A4', rim:'sotoen',  body:'liso',     corner:'sumiiri'},
    {id:'neagari', name:'Redonda alta',            style:'Neagari (raíces expuestas)',  note:'Cilindro alto que deja las raíces a la vista por encima del borde.',                                  type:'round',L:10, W:10, H:12,  t:0.7, flare:0,   feet:1.2, paper:'A4', rim:'uchien',  body:'liso',     corner:'recta'},
    {id:'kusamono',name:'Redonda de acento',       style:'Kusamono / Shitakusa (planta de acento)', note:'Para hierbas y musgos que acompañan la exposición. Pared gruesa, forma cerrada.',           type:'round',L:8,  W:8,  H:4,   t:0.6, flare:0,   feet:0.6, paper:'A4', rim:'kittate', body:'panza',    corner:'recta'}
  ];
  const FINISH={
    shudei:{name:'Shudei rojizo sin esmalte',body:'#8E5A3C',dark:'#6B4029',light:'#A97555',rim:'#5A3521'},
    azul:{name:'Esmalte azul namako',body:'#3E6E8E',dark:'#2C5069',light:'#6C97B3',rim:'#22405A'},
    oribe:{name:'Esmalte verde oribe',body:'#5E7F4F',dark:'#455F3A',light:'#86A375',rim:'#354B2C'},
    crema:{name:'Esmalte crema',body:'#D9CBA8',dark:'#B5A57F',light:'#EEE4CC',rim:'#9A8A64'},
    gris:{name:'Cemento gris natural',body:'#8E9091',dark:'#6C6E70',light:'#B5B7B8',rim:'#55575A'},
    oxido:{name:'Cemento con óxido de hierro',body:'#A0654A',dark:'#7B4B36',light:'#BE8A70',rim:'#5F3A28'},
    negro:{name:'Cemento con óxido negro',body:'#4A4B4C',dark:'#2F3031',light:'#6E7071',rim:'#1F2021'}
  };
  const RIM_NAME={sotoen:'sotoen (labio externo)',kittate:'kittate (sin labio)',uchien:'uchien (labio interno)'};
  const BODY_NAME={liso:'cuerpo liso',cinturon:'con cinturón',panza:'panza convexa'};
  const CORNER_NAME={recta:'esquinas rectas',sumikiri:'sumikiri (esquina cortada)',nadekaku:'nadekaku (esquina redondeada)',sumiiri:'sumiiri (esquina entrante)'};
  let uidN=0; const uid=()=>'c'+(++uidN);
  const CUT='fill="none" stroke="#000" stroke-width="0.35"';
  const REF='fill="none" stroke="#555" stroke-width="0.25" stroke-dasharray="2 1.5"';
  const SEAM='fill="none" stroke="#000" stroke-width="0.3" stroke-dasharray="4 1.2 1 1.2"';
  const HATCH='<pattern id="hz" width="2.2" height="2.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="2.2" stroke="#000" stroke-width="0.28"/></pattern><pattern id="hl" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="3" stroke="#777" stroke-width="0.22"/></pattern><pattern id="gr" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0 L0 0 0 10" fill="none" stroke="#bbb" stroke-width="0.15"/></pattern>';
  const cm=mm=>(Math.round(mm/10*100)/100).toLocaleString('es-EC',{maximumFractionDigits:2});
  const pct=n=>(Math.round(n*10)/10).toLocaleString('es-EC',{maximumFractionDigits:1});
  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const r1=n=>Math.round(n*100)/100;
  function txt(x,y,str,o={}){
    return `<text x="${r1(x)}" y="${r1(y)}" font-family="IBM Plex Mono, monospace" font-size="${o.s||2.8}" font-weight="${o.w||400}" fill="${o.c||'#000'}" text-anchor="${o.a||'start'}"${o.r?` transform="rotate(-90 ${r1(x)} ${r1(y)})"`:''}>${esc(str)}</text>`;
  }
  function label(name,dims,x,y){ return txt(x,y,name,{s:4,w:500})+txt(x,y+4.2,dims,{c:'#333'}); }
  const pts2s=pts=>pts.map(p=>r1(p[0])+','+r1(p[1])).join(' ');
  function holes(cx,cy,spread,small,plug){
    const r=small?7:10;
    let g=`<circle cx="${cx}" cy="${cy}" r="${r}" ${CUT}/><line x1="${cx-3}" y1="${cy}" x2="${cx+3}" y2="${cy}" stroke="#000" stroke-width=".2"/><line x1="${cx}" y1="${cy-3}" x2="${cx}" y2="${cy+3}" stroke="#000" stroke-width=".2"/>`;
    g+=`<circle cx="${cx-spread}" cy="${cy}" r="3" ${CUT}/><circle cx="${cx+spread}" cy="${cy}" r="3" ${CUT}/>`;
    g+=txt(cx,cy+r+5,plug?`tapón PVC Ø${cm(2*r)} cm · alambrado: clavos Ø0,6 cm`:`drenaje Ø${cm(2*r)} cm · alambrado Ø0,6 cm`,{a:'middle',s:2.3,c:'#333'});
    return g;
  }
  const footSize=L=>Math.min(20,Math.max(10,L/8));
  function ellipsePerim(a,c){ const hh=Math.pow(a-c,2)/Math.pow(a+c,2); return Math.PI*(a+c)*(1+3*hh/(10+Math.sqrt(4-3*hh))); }
  // rectangular outline with the classic corner treatments
  function cornerPath(x,y,L,W,style,c){
    c=Math.min(c,L/3,W/3);
    if(style==='sumikiri') return `M${r1(x+c)} ${r1(y)} H${r1(x+L-c)} L${r1(x+L)} ${r1(y+c)} V${r1(y+W-c)} L${r1(x+L-c)} ${r1(y+W)} H${r1(x+c)} L${r1(x)} ${r1(y+W-c)} V${r1(y+c)} Z`;
    if(style==='nadekaku') return `M${r1(x+c)} ${r1(y)} H${r1(x+L-c)} A${c} ${c} 0 0 1 ${r1(x+L)} ${r1(y+c)} V${r1(y+W-c)} A${c} ${c} 0 0 1 ${r1(x+L-c)} ${r1(y+W)} H${r1(x+c)} A${c} ${c} 0 0 1 ${r1(x)} ${r1(y+W-c)} V${r1(y+c)} A${c} ${c} 0 0 1 ${r1(x+c)} ${r1(y)} Z`;
    if(style==='sumiiri') return `M${r1(x+c)} ${r1(y)} H${r1(x+L-c)} V${r1(y+c)} H${r1(x+L)} V${r1(y+W-c)} H${r1(x+L-c)} V${r1(y+W)} H${r1(x+c)} V${r1(y+W-c)} H${r1(x)} V${r1(y+c)} H${r1(x+c)} Z`;
    return `M${r1(x)} ${r1(y)} H${r1(x+L)} V${r1(y+W)} H${r1(x)} Z`;
  }

  // ---------- WALL PROFILES (the "perfil": half section, x outward from the axis, y down from the rim) ----------
  function lipH(s){ return Math.max(4,Math.min(10,s.t*0.9)); }
  function halfExt(s,R,H,ft,d){
    const lh=lipH(s), yb=H-ft, xAt=y=>R-d*(y/yb), pts=[];
    if(s.rim==='sotoen'){ pts.push([R+s.lip,0],[R+s.lip,lh],[xAt(lh+s.lip*0.6),lh+s.lip*0.6]); } else pts.push([R,0]);
    const y0=pts[pts.length-1][1];
    if(s.body==='cinturon'&&yb-y0>16){ const yc=y0+(yb-y0)*0.5, bh=Math.min(4,(yb-y0)/6), bw=Math.min(3,Math.max(1.5,s.t*0.3)); pts.push([xAt(yc-bh),yc-bh],[xAt(yc-bh)+bw,yc-bh],[xAt(yc+bh)+bw,yc+bh],[xAt(yc+bh),yc+bh]); }
    else if(s.body==='panza'){ const bulge=Math.min(6,Math.max(2,s.t*0.5)); for(let k=1;k<=7;k++){ const y=y0+(yb-y0)*k/8; pts.push([xAt(y)+bulge*Math.sin(Math.PI*(y-y0)/(yb-y0)),y]); } }
    pts.push([xAt(yb),yb]);
    return pts;
  }
  function halfInt(s,Rc,Hc,d){
    const lh=lipH(s), pts=[];
    if(s.rim==='uchien'&&Hc>lh+6){ pts.push([Rc-s.lip,0],[Rc-s.lip,lh],[Rc,lh+s.lip*0.6]); } else pts.push([Rc,0]);
    pts.push([Rc-d,Hc]); return pts;
  }
  function withFeet(half,ft,fw){ const [xb,yb]=half[half.length-1]; if(ft<=0) return half; return half.concat([[xb-4,yb],[xb-4,yb+ft],[xb-4-fw,yb+ft],[xb-4-fw,yb]]); }
  const xmax=half=>Math.max(...half.map(p=>p[0]));
  function mirror(half,cx,top){ return half.map(([x,y])=>[cx-x,top+y]).concat(half.slice().reverse().map(([x,y])=>[cx+x,top+y])); }

  function readState(){
    const mat=$('matCement').checked?'cement':'clay';
    const s={mat,type:$('type').value,L:+$('L').value*10,W:+$('W').value*10,H:+$('H').value*10,t:+$('t').value*10,shrink:mat==='clay'?+$('shrink').value:0,flare:+$('flare').value*10,feet:+$('feet').value*10,base:+$('base').value*10,m:+$('board').value*10,paper:$('paper').value,finish:$('finish').value,rim:$('rim').value,body:$('body').value,corner:$('type').value==='rect'?$('corner').value:'recta',lip:+$('lip').value*10};
    if(s.type==='round') s.W=s.L;
    if(s.type==='oval') s.flare=0;
    if(mat==='clay'&&s.type==='round') s.flare=0;
    s.c=Math.min(25,Math.max(8,Math.min(s.L,s.W)*0.12)); // corner size
    s.lipX=s.rim==='sotoen'?s.lip:0;                      // outward growth at the rim
    return s;
  }
  function build(s){
    const k=1/(1-s.shrink/100);
    const b={k,L:s.L*k,W:s.W*k,H:s.H*k,feet:s.feet*k,t:s.t};
    b.wall=b.H-b.t-b.feet;
    b.core=s.H-s.feet-s.base;
    return b;
  }

  // ---------- CLAY PIECES ----------
  function baseRect(s,b){
    const {L,W,t}=b; let g=`<defs>${HATCH}</defs>`;

    g+=`<defs><clipPath id="${id}"><path d="${path}"/></clipPath></defs><g clip-path="url(#${id})">`;
    g+=`<rect x="0" y="0" width="${L}" height="${t}" fill="url(#hz)"/><rect x="0" y="${W-t}" width="${L}" height="${t}" fill="url(#hz)"/><rect x="0" y="0" width="${t}" height="${W}" fill="url(#hz)"/><rect x="${L-t}" y="0" width="${t}" height="${W}" fill="url(#hz)"/>`;
    if(s.corner!=='recta'){ const c=s.c*b.k; [[0,0],[L-c,0],[0,W-c],[L-c,W-c]].forEach(([x,y])=>{g+=`<rect x="${x}" y="${y}" width="${c}" height="${c}" fill="url(#hz)"/>`;}); }
    g+=`</g><rect x="${t}" y="${t}" width="${L-2*t}" height="${W-2*t}" ${REF}/>`;
    const f=footSize(L);

    g+=holes(L/2,W/2,Math.max(15,L/5),L<110);
    g+=`<path d="${path}" ${CUT}/>`;
    g+=label('Fondo ×1',`${cm(L)} × ${cm(W)} cm · placa ${cm(t)} cm · ${CORNER_NAME[s.corner]}`,t+3+(s.corner==='recta'?0:s.c*b.k*0.5),t+6.5);
    if(W>70) g+=txt(L/2,W-t-3,'rayado = asiento de paredes · punteado = patas',{a:'middle',s:2.3,c:'#333'});
    return {name:'Fondo',qty:1,w:L,h:W,inner:g};

  function wall(name,qty,wb,wt,h,t,ends,flare,o={}){

    g+=label(`${name} ×${qty}`,o.dims||`borde ${cm(wt)} · base ${cm(wb)} · alto ${cm(h)} cm`,Math.max(t,off)+3,7.5);
    if(o.note&&h>22) g+=txt(wt/2,h-(o.noHatch?3:t+2),o.note,{a:'middle',s:2.3,c:'#333'});
    else if(flare>0&&h>22&&!o.note) g+=txt(wt/2,h-t-2,`inclinación ${cm(flare)} cm por lado · borde superior arriba`,{a:'middle',s:2.3,c:'#333'});

  function feetPiece(b,f){
    const gap=6,w=2*f+gap; let g=`<rect x="0" y="0" width="${f}" height="${f}" ${CUT}/><rect x="${f+gap}" y="0" width="${f}" height="${f}" ${CUT}/><rect x="0" y="${f+gap}" width="${f}" height="${f}" ${CUT}/><rect x="${f+gap}" y="${f+gap}" width="${f}" height="${f}" ${CUT}/>`;

  function baseOval(b,round){
    const {L,W,t}=b, cx=L/2, cy=W/2, rx=L/2, ry=W/2; const id=uid();
    let g=`<defs>${HATCH}<clipPath id="${id}"><ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/></clipPath></defs>`;
    g+=`<g clip-path="url(#${id})"><rect x="0" y="0" width="${L}" height="${W}" fill="url(#hz)"/><ellipse cx="${cx}" cy="${cy}" rx="${rx-t}" ry="${ry-t}" fill="#fff"/></g>`;

    g+=`<line x1="${cx}" y1="0" x2="${cx}" y2="${W}" ${REF}/><line x1="0" y1="${cy}" x2="${L}" y2="${cy}" ${REF}/>`;
    const f=footSize(L);
    if(b.feet>0){ [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sy])=>{ const x=cx+sx*(rx-t)*0.62-f/2, y=cy+sy*(ry-t)*0.62-f/2; g+=`<rect x="${x}" y="${y}" width="${f}" height="${f}" ${REF}/>`;}); }
    g+=holes(cx,cy,Math.max(15,L/5),L<110);
    g+=`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" ${CUT}/>`;
    g+=label('Fondo ×1',round?`Ø ${cm(L)} cm · placa ${cm(t)} cm`:`${cm(L)} × ${cm(W)} cm · placa ${cm(t)} cm`,cx-rx*0.5,t+9);

  function strip(len,h,t,perim,o={}){
    let g=`<defs>${HATCH}</defs>`;
    if(!o.noHatch) g+=`<rect x="0" y="${h-t}" width="${len}" height="${t}" fill="url(#hz)"/><rect x="${len-15}" y="0" width="15" height="${h}" fill="url(#hz)"/>`;

    g+=`<rect x="0" y="0" width="${len}" height="${h}" ${CUT}/>`;
    g+=label(o.name||'Pared ×1 (tira continua)',o.dims||`${cm(len)} × ${cm(h)} cm · perímetro ${cm(perim)} cm + 1,5 cm de empalme en bisel`,Math.max(t,4)+3,10.5);
    if(h>22) g+=txt(len/2,h-3,o.note||'marcas superiores cada 1 cm · el extremo rayado se bisela y monta sobre el otro',{a:'middle',s:2.2,c:'#333'});

  function coilPiece(s,b,len){
    // rim coil for clay lips: a rolled strip added after assembly

    let g=`<rect x="0" y="8" width="${w}" height="${d}" ${CUT}/>`+txt(w/2,6,`Rollo del labio ${RIM_NAME[s.rim]}: Ø ${cm(d)} cm × ${cm(len)} cm de largo`,{a:'middle',s:2.6})+txt(w/2,h-1.5,s.rim==='sotoen'?'pegar por fuera del borde superior, rayado y barbotina, alisar la unión inferior':'pegar por dentro del borde superior y alisar hacia abajo',{a:'middle',s:2.2,c:'#333'});
    return {name:'Rollo del labio',qty:1,w,h,inner:g};
  }
  function clayPieces(s,b){
    const p=[]; const c=s.c*b.k;
    if(s.type==='rect'){
      p.push(baseRect(s,b));
      const cut=s.corner==='sumikiri'?2*c:0;
      p.push(wall('Pared larga',2,b.L-cut,b.L-cut+2*s.flare,b.wall,b.t,s.corner!=='sumikiri',s.flare));
      p.push(wall('Pared corta',2,b.W-2*b.t-cut,b.W-2*b.t-cut+2*s.flare,b.wall,b.t,false,s.flare));
      if(s.corner==='sumikiri'){ const cw=c*Math.SQRT2; p.push(wall('Chaflán de esquina',4,cw,cw+2*s.flare*0.7,b.wall,b.t,true,0,{dims:`${cm(cw)} × ${cm(b.wall)} cm · placa ${cm(b.t)}`,note:'une los extremos de las paredes larga y corta a 45°'})); }
      if(s.rim!=='kittate') p.push(coilPiece(s,b,2*(b.L+b.W)+20));
    } else {
      p.push(baseOval(b,s.type==='round'));
      const a=(b.L-b.t)/2, cc=(b.W-b.t)/2;
      const per=s.type==='round'?Math.PI*(b.L-b.t):ellipsePerim(a,cc);
      p.push(strip(per+15,b.wall,b.t,per));
      if(s.rim!=='kittate') p.push(coilPiece(s,b,per+20));

  }

  // ---------- CEMENT: sweep machine with a plan guide (one system for every shape) ----------
  // The pot is swept upside down on a plate cut to its rim outline. A follower rides the plate edge and carries the
  // profile blade, so the blade traces the plan while its cut edge gives the wall section. No box, no core.
  function planShape(s,x,y,Lg,Wg){
    if(s.type==='round') return a=>`<circle cx="${r1(x+Lg/2)}" cy="${r1(y+Wg/2)}" r="${r1(Lg/2)}" ${a}/>`;
    if(s.type==='oval') return a=>`<ellipse cx="${r1(x+Lg/2)}" cy="${r1(y+Wg/2)}" rx="${r1(Lg/2)}" ry="${r1(Wg/2)}" ${a}/>`;
    const st=(s.corner==='recta'||s.corner==='sumiiri')?'nadekaku':s.corner, cc=(s.corner==='recta'||s.corner==='sumiiri')?6:s.c;
    return a=>`<path d="${cornerPath(x,y,Lg,Wg,st,cc)}" ${a}/>`;
  }
  function planGuide(s){

        <svg width="12mm" height="4mm" viewBox="0 0 12 4"><line x1="0" y1="2" x2="12" y2="2" ${SEAM}/></svg><span>Empalme entre tramos impresos</span>`
      :`
        <svg width="12mm" height="4mm" viewBox="0 0 12 4"><line x1="0" y1="2" x2="12" y2="2" stroke="#000" stroke-width=".4"/></svg><span>Línea de corte del plato-guía o de la lámina</span>
        <svg width="12mm" height="4mm" viewBox="0 0 12 4"><line x1="0" y1="2" x2="12" y2="2" stroke="#000" stroke-width=".7"/></svg><span>Borde de barrido del perfil</span>
        <svg width="12mm" height="4mm" viewBox="0 0 12 4"><defs>${HATCH}</defs><rect width="12" height="4" fill="url(#hz)"/><rect width="12" height="4" ${CUT}/></svg><span>Mortero en sección</span>
        <svg width="12mm" height="4mm" viewBox="0 0 12 4"><defs>${HATCH}</defs><rect width="12" height="4" fill="url(#hl)"/><rect width="12" height="4" ${CUT}/></svg><span>Silueta de la maceta: retirar de la lámina</span>
        <svg width="12mm" height="4mm" viewBox="0 0 12 4"><line x1="0" y1="2" x2="12" y2="2" ${REF}/></svg><span>Referencia: huella del pie o superficie del plato, no cortar</span>`;
    const mix=clay?'':`<div class="note"><b>Mezcla:</b> 1 cemento : 2 arena fina tamizada, un puñado de fibra por litro, agua 0,45 por parte de cemento, textura de pasta espesa que se sostenga en montón. Aceite sobre el plato-guía. Tras el curado, 3 días en agua para lavar la alcalinidad.</div>`;
    let html=`<section class="sheet" ${sheetStyle}><div class="cover"><div>
      <div class="eyebrow">${clay?'Plantillas de corte · técnica de placas':'Molde de cemento · '+MOLD_SHORT[s.type]} · escala 1:1</div>
      <h1>${esc(title)}</h1>
      <div class="style">${current?`Para estilo <b>${esc(current.style)}</b>. ${esc(current.note)}`:`Forma ${shapeName(s).toLowerCase()} de medidas personalizadas.`}</div>
      <table>${rows}</table>
      <div class="note"><b>Antes de imprimir:</b> escala 100 %, sin «ajustar a página», papel ${s.paper} horizontal. Verifica la regla de 10 cm con una regla metálica.</div>
      <ol>${steps}</ol>${mix}
      <div class="legend">${legend}</div>
    </div><div class="right"><div>${ruler()}</div><div class="duo"><div>${il.svg}<div class="viewcap">${esc(il.cap)}</div></div><div>${v.svg}<div class="viewcap">${esc(v.cap)}</div></div></div></div></div>${foot(1)}</section>`;
    pages.forEach((pg,i)=>{
      html+=`<section class="sheet" ${sheetStyle}>`;
      pg.items.forEach(({it,x,y})=>{ html+=`<div class="piece" style="left:${MARGIN+x}mm;top:${MARGIN+y}mm;width:${it.w}mm"><div class="cap">${esc(it.name)}${it.qty>1?' ×'+it.qty:''}</div>${pieceSvg(it)}</div>`; });
      html+=foot(i+2)+'</section>';
    });
    $('sheets').innerHTML=html; $('sheets').style.width=paper.w+'mm';
    const tabDefs=[{label:'Portada',sub:'ficha, regla de calibración, ilustración'}].concat(pages.map((pg,i)=>({label:`Hoja ${i+2}`,sub:[...new Set(pg.items.map(({it})=>it.name.replace(/ · (tramo|franja).*$/,'')))].join(' · ')})));
    tabDefs.push({label:'Todas',sub:`${nSheets} hojas seguidas`});
    if(view!=='all'&&view>=tabDefs.length-1) view=tabDefs.length-2;
    $('tabs').innerHTML=tabDefs.map((t,i)=>`<button type="button" class="tab" role="tab" data-i="${i===tabDefs.length-1?'all':i}">${esc(t.label)}<small>${esc(t.sub)}</small></button>`).join('');
    $('summary').innerHTML=clay
      ?`<div>Placa cruda: <b>${cm(b.L)} × ${cm(b.W)} cm</b>, pared <b>${cm(b.wall)} cm</b></div><div>Perfil: <b>${esc(profileLine)}</b></div><div>Factor de contracción: <b>×${b.k.toFixed(3).replace('.',',')}</b></div><div>Plantillas: <b>${nPieces}</b> · Hojas: <b>${nSheets}</b> ${s.paper}</div><div>Generado ${today}</div>`
      :`<div>Sistema: <b>${MOLD_NAME[s.type]}</b></div><div>Perfil: <b>${esc(profileLine)}</b></div><div>Plato-guía: <b>${s.type==='round'?'Ø '+cm(s.L+2*s.lipX):cm(s.L+2*s.lipX)+' × '+cm(s.W+2*s.lipX)} cm</b> · cavidad <b>${cm(b.core)} cm</b></div><div>Mortero: <b>≈ ${pct(litres*1.15)} L</b> (${pct(litres*1.15*2.1)} kg)</div><div>Plantillas: <b>${nPieces}</b> · Hojas: <b>${nSheets}</b> ${s.paper}</div><div>Generado ${today}</div>`;
    $('warns').innerHTML=warns.map(w=>`<div class="warn">${esc(w)}</div>`).join('');
    $('styleNote').innerHTML=current?`<b>${esc(current.style)}.</b> ${esc(current.note)}`:'Medidas personalizadas. Elige un modelo de la lista para volver a un estilo.';
    applyView();
  }
  let lastScale=-1, lastW=-1;
  function fit(force){
    const stage=$('stage'), sheets=$('sheets');
    const sheetPx=parseFloat(sheets.style.width||'297')*96/25.4;
    const w=stage.clientWidth;
    if(!force&&Math.abs(w-lastW)<2) return;
    lastW=w;
    const sc=Math.min(1,w/sheetPx);
    if(force||Math.abs(sc-lastScale)>0.002){ lastScale=sc; sheets.style.transform=`scale(${sc})`; }
    stage.style.height=Math.ceil(sheets.getBoundingClientRect().height)+'px';
  }
  function cementWall(p){ return p.L<=12?1.5:p.L>=30?2:1.8; }
  function cementBase(H,feet){ return Math.round(Math.min(2.5,Math.max(0.8,(H-feet)*0.45))*10)/10; }
  function applyPreset(id){
    const p=PRESETS.find(x=>x.id===id); if(!p){ current=null; render(); return; }
    current=p; const clay=$('matClay').checked;
    $('type').value=p.type; $('L').value=p.L; $('W').value=p.W; $('H').value=p.H; $('feet').value=p.feet; $('paper').value=p.paper;
    $('rim').value=p.rim; $('body').value=p.body; $('corner').value=p.corner; $('lip').value=p.L<=12?0.4:0.6;
    if(clay){ $('t').value=p.t; $('flare').value=p.flare; }
    else {
      $('t').value=cementWall(p); $('flare').value=p.type==='oval'?0:0.5; $('base').value=cementBase(p.H,p.feet);
      const lip=p.rim==='sotoen'?(p.L<=12?0.8:1.2):0;
      const tallest=Math.max(p.W+lip+0.6, p.H+3);
      if(tallest>17.6) $('paper').value='A3';
    }
    render();
  }
  function switchMaterial(){
    const clay=$('matClay').checked;
    const f=$('finish'); if(clay&&['gris','oxido','negro'].includes(f.value)) f.value='shudei'; if(!clay&&!['gris','oxido','negro'].includes(f.value)) f.value='gris';
    if(current) applyPreset(current.id);
    else { if(!clay){ if(+$('t').value<1.2) $('t').value=1.8; $('base').value=cementBase(+$('H').value,+$('feet').value); } else { if(+$('t').value>1.5) $('t').value=0.7; } render(); }
  }
  const sel=$('preset');
  sel.innerHTML=PRESETS.map(p=>`<option value="${p.id}">${esc(p.style)} — ${esc(p.name)} ${p.type==='round'?'Ø'+p.L:p.L+'×'+p.W}×${p.H}</option>`).join('')+'<option value="custom">Personalizada</option>';
  sel.addEventListener('change',()=>applyPreset(sel.value));
  ['type','L','W','H','t','flare','feet','base','board','rim','body','corner','lip'].forEach(id=>$(id).addEventListener('input',()=>{ current=null; sel.value='custom'; render(); }));
  ['shrink','paper','finish'].forEach(id=>$(id).addEventListener('input',render));
  $('matClay').addEventListener('change',switchMaterial); $('matCement').addEventListener('change',switchMaterial);
  $('btnPrint').addEventListener('click',()=>window.print());
  new ResizeObserver(()=>fit(false)).observe($('stage'));
  window.addEventListener('beforeprint',()=>{$('sheets').style.transform='none';});
  window.addEventListener('afterprint',()=>fit(true));
  sel.value='chokkan'; applyPreset('chokkan');
})();
</script>
</body>
</html>
